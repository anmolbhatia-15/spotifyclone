<head>

    <link rel="stylesheet" href="style.css">
<link rel="stylesheet"

</head>
<!-- <audio src="Let Me Love You - DJ Snake.mp3" controls></audio> -->
<body>
    <nav>
        <ul>
            <li class="brand"><img src="https://www.freepnglogos.com/uploads/spotify-logo-png/file-spotify-logo-png-4.png" alt="spotify">
            <span>Spotify</span>
            </li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

<div class="container">
    <div class="songlist">

        <h1>Playlist</h1>

            </div>
            <div class="songItem">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjpFZqVHij_AKXmWB0MGF70kN-LJ6d0uT8Gec6Atou-g&s=10" alt="1">
                <span class="songname">God plan</span>
                <span class="songlistplay"><span class="timestamp">05:34 <i id="1"  class="fa-regular songitem fa-circle-play" ></i></span> </span>
            </div>
            <div class="songItem">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzrD8rQuzU_fVgIxqNnOmgpuPQ-oE2uR3NRAnLZ9Fulg&s=10" alt="1">

                <span class="songlistplay"><span class="timestamp">05:34 <i id="2"  class="fa-regular songitem fa-circle-play " ></i></span> </span>
            </div>
            <div class="songItem">

                <span class="songlistplay"><span class="timestamp">05:34 <i id="3"  class="fa-regular songitem fa-circle-play" ></i></span> </span>
            </div>
            <div class="songItem">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQAo2qSHDXxfj7oUZGo-ZbhoNVb3ofwkcB3f7KL4oabVw&s=10" alt="1">

    <div class="songBanner"></div>

</div>
<div class="bottom">
    <input type="range" name="range" id="myProgressbar" min="0" max="100" value="0">
    <div class="icons">
  <i class="fa-solid fa-backward-step" id="previous"></i>
<i class="fa-regular fa-circle-play" id="masterPlay"></i>
<i class="fa-solid fa-forward-step" id="next"></i>
<!-- <i class="fa-solid fa-pause"></i> -->
</div>
<div class="songinfo">
    <img src="https://cdn.pixabay.com/animation/2025/10/28/00/58/00-58-09-154_512.gif" id="gif" alt=""><br>
  <span id="mastersongname">  Let me Love you - Justin Beiber</span>
</div>
</div>
